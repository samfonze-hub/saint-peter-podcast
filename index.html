<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saint Peter — The Podcast</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap');

  :root {
    --ink: #1a1208;
    --cream: #f5efe3;
    --gold: #c9963a;
    --rust: #a64b2a;
    --ocean: #1e3a4a;
    --sand: #e8d9bf;
    --highlight: #f0c060;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 200px;
    background-image:
      radial-gradient(ellipse at 10% 20%, rgba(201,150,58,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(30,58,74,0.06) 0%, transparent 50%);
  }

  .masthead { text-align: center; margin-bottom: 48px; }
  .masthead .eyebrow { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
  .masthead h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 700; line-height: 1.05; color: var(--ocean); }
  .masthead h1 em { font-style: italic; color: var(--rust); }
  .masthead .tagline { font-size: 11px; letter-spacing: 2px; color: var(--ink); opacity: 0.5; margin-top: 10px; }
  .divider { width: 60px; height: 1px; background: var(--gold); margin: 20px auto; }

  .voice-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: white; border: 1px solid var(--sand); border-radius: 20px;
    padding: 6px 14px; font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--ocean); margin-bottom: 32px;
  }
  .voice-badge span { color: var(--gold); font-weight: bold; }

  .episodes { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 40px; }

  .episode-card {
    background: white; border: 1px solid var(--sand); border-radius: 4px;
    padding: 18px 22px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 18px;
    position: relative; overflow: hidden;
  }
  .episode-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--gold); transform: scaleY(0); transition: transform 0.25s; transform-origin: bottom;
  }
  .episode-card:hover::before, .episode-card.active::before { transform: scaleY(1); }
  .episode-card:hover { border-color: var(--gold); box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .episode-card.active { border-color: var(--gold); background: #fffdf8; }
  .episode-card.loading { opacity: 0.7; cursor: wait; }

  .ep-number { font-size: 26px; font-family: 'Playfair Display', serif; color: var(--sand); font-weight: 700; min-width: 40px; }
  .ep-info { flex: 1; }
  .ep-info h3 { font-family: 'Playfair Display', serif; font-size: 0.95rem; color: var(--ocean); margin-bottom: 3px; }
  .ep-info p { font-size: 9px; color: var(--ink); opacity: 0.5; letter-spacing: 1px; text-transform: uppercase; }
  .ep-status { font-size: 9px; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

  .ep-play-btn {
    width: 34px; height: 34px; border-radius: 50%; background: var(--ocean);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.2s;
  }
  .ep-play-btn:hover { background: var(--rust); }
  .ep-play-btn svg { fill: white; }

  /* Spinner for loading state */
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(201,150,58,0.3); border-top-color: var(--gold);
    animation: spin 0.8s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Player */
  .player {
    width: calc(100% - 32px); max-width: 700px;
    background: var(--ocean); border-radius: 8px; padding: 24px 28px;
    color: white; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    box-shadow: 0 20px 60px rgba(30,58,74,0.45); z-index: 10;
  }

  .status-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.5; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.25); flex-shrink: 0; transition: background 0.3s; }
  .status-dot.playing { background: var(--gold); animation: pulse 1.5s infinite; }
  .status-dot.loading { background: var(--gold); animation: pulse 0.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.15} }

  .player-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-subtitle { font-size: 9px; opacity: 0.4; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }

  .controls { display: flex; align-items: center; gap: 16px; }

  .play-pause {
    width: 46px; height: 46px; border-radius: 50%; background: var(--gold);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .play-pause:hover { background: var(--highlight); transform: scale(1.05); }
  .play-pause:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .progress-wrap { flex: 1; }
  .progress-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; margin-bottom: 6px; cursor: pointer; position: relative; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 2px; width: 0%; transition: width 0.25s linear; }
  .time-row { display: flex; justify-content: space-between; font-size: 9px; opacity: 0.4; letter-spacing: 1px; }

  .generating-bar {
    width: 100%; height: 3px; background: rgba(255,255,255,0.15);
    border-radius: 2px; margin-bottom: 6px; overflow: hidden;
  }
  .generating-bar-fill {
    height: 100%; width: 30%; background: var(--gold);
    border-radius: 2px; animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="eyebrow">A Culinary Audio Experience</div>
  <h1>Saint Peter<br><em>The Podcast</em></h1>
  <div class="divider"></div>
  <div class="tagline">Josh Niland's temple of the whole fish · Sydney, NSW</div>
</div>

<div class="voice-badge">🎙 Voice: <span>George</span> &nbsp;·&nbsp; Powered by ElevenLabs</div>

<div class="episodes" id="episodeList"></div>

<div class="player">
  <div class="status-label">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Select an episode to begin</span>
  </div>
  <div class="player-title" id="playerTitle">—</div>
  <div class="player-subtitle" id="playerSubtitle">Saint Peter Podcast · George · ElevenLabs</div>

  <div class="controls">
    <button class="play-pause" id="playPauseBtn" onclick="togglePlay()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#1e3a4a"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="progress-wrap">
      <div id="progressBarWrap">
        <div class="progress-bar" id="progressBar" onclick="seekTo(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="time-row">
        <span id="timeElapsed">0:00</span>
        <span id="timeTotal">—</span>
      </div>
    </div>
  </div>
</div>

<script>
const API_KEY = "sk_d98fa937ec202e86935221707bd28010a236d51041596877";
const VOICE_ID = "JBFqnCBsd6RMkjVDRZzb"; // George

const EPISODES = [
  {
    id: 1,
    title: "Welcome to Saint Peter",
    subtitle: "The philosophy of the whole fish",
    script: "Welcome to Saint Peter — one of the most extraordinary restaurants in Australia, and honestly, one of the most important fish restaurants in the world. Tucked away on Paddington's Oxford Street in Sydney, Saint Peter is the brainchild of chef Josh Niland, and from the moment you sit down, you understand that something genuinely different is happening here. This isn't just a seafood restaurant. It's a complete rethinking of what fish cookery can be. At the heart of everything Niland does is a deceptively simple idea: treat fish the way a great butcher treats meat. Now, that might not sound revolutionary at first, but consider this — when chefs are trained in culinary school, they're taught to use around forty-five to fifty-five percent of a fish. The fillets, maybe the bones for a stock, and that's largely it. Niland and his team use ninety percent. Ninety. The only things consistently left behind are the gills and the gallbladder. Everything else — the heads, the collars, the livers, the roe, the belly fat, the eyes — all of it finds a purpose on the menu. To make this vision a complete reality, Niland opened Fish Butchery, a sister venue in Waterloo, operating with the same principles as a traditional butcher shop but dedicated entirely to fish. It's where the secondary cuts and offcuts get transformed — dry-aged, cured, smoked, ground, pressed — before finding their way onto your plate at Saint Peter. And why does this matter? Two reasons: sustainability and flavour. On the sustainability front, dramatically reducing waste across the fishing supply chain is one of the most meaningful things a restaurant can do. On the flavour front, the parts of the fish that most restaurants discard are often the most delicious — rich with fat, collagen and depth. Josh Niland didn't just open a great restaurant. He started a movement."
  },
  {
    id: 2,
    title: "The Art of Fish Charcuterie",
    subtitle: "Salamis, nduja and mortadella — but make it fish",
    script: "If there's one thing that genuinely stops first-time visitors to Saint Peter in their tracks, it's the charcuterie board. Because what arrives at your table looks, at first glance, like something from a very serious Italian salumeria — cured meats, thinly sliced salamis, a silky pate piped into a crisp tart shell. But here's the twist: there's not a single gram of pork or beef in any of it. Every last piece is made from fish. The charcuterie program is a direct expression of Josh Niland's whole-fish philosophy, and it's where the secondary cuts get their moment to shine. Take the Striped Marlin Ham. A whole piece of marlin is cured for a full week in salt and sugar, then cold smoked over apple wood chips, then hung in the charcuterie cabinet for a minimum of six weeks, with the ambition of serving it at eight. Eight weeks. That's patience on a level that puts most prosciutto makers to shame. The result is something deeply savoury, almost nutty, with that characteristic translucent sheen you'd expect from a great cured ham. Then there's the Swordfish Belly Bacon — cured in a ground blend of salt, sugar, cumin, coriander, pepper, fennel and star anise before being cold smoked and hung. And the Yellowfin Tuna Salami, made from the sinew-rich trimmings of the head, tail and collar, ground together with salt-cured Murray Cod fat and stuffed into beef casings. These salamis need to lose thirty percent of their original moisture before they're ready — a process that takes anywhere from four to six weeks. Perhaps the most technically astonishing is the Rock Flathead Mortadella. Flathead trimmings are pureed with egg white to create an almost mousse-like texture, mixed with Murray Cod fat and Swordfish Belly Bacon, filled into a synthetic casing and steamed. It's a fish mortadella. And it is extraordinary."
  },
  {
    id: 3,
    title: "Bones, Broth and Pasta",
    subtitle: "The consomme and bone noodle technique",
    script: "Every great meal at Saint Peter begins the same way — with an act of homage. The opening course is Saint Peter's Fish Soup, an ode to the patron saint of fishermen himself, and it arrives in a cup that is itself made partly from fish bones. It's built on a traditional bouillabaisse base — roasted shells of Manjimup Marron and Eastern Rock Lobster cooked down in a mirepoix of tomato, onion, garlic and white wine, blended until the texture is thick and velvety in the mouth. Rich, aromatic, deeply oceanic. But what makes this course genuinely jaw-dropping is what's floating inside it — coral trout bone noodles. This is one of the most innovative techniques in contemporary Australian cooking, and the process is extraordinary. The bones of coral trout are first boiled to extract everything off them, then pressure cooked for two full hours until they become soft and gelatinous. They're then pureed with one part water to two parts bones, passed through a fine sieve, and that paste is mixed with equal parts flour to create a pasta dough. The bones become the pasta. It's a technique of such elegant circularity that it almost feels like philosophy as much as cookery. The consomme course takes the same idea further. Coral trout frames are roasted until golden and caramelised, reduced into a rich aromatic stock, enriched with oysters and scallops, then clarified with egg white until perfectly clear. Inside float agnolotti — pasta parcels whose dough is also made from pressure-cooked coral trout bones, stuffed with rockflathead mortadella mousse. And those cups? They're made by Sam Gordon, a potter based in Gembrook, Victoria. The clay is forty percent Murray Cod bones. The glaze is one hundred percent Murray Cod bones. Even the vessel you drink from is an act of whole-fish thinking."
  },
  {
    id: 4,
    title: "The Fishermen Behind the Menu",
    subtitle: "Luke, Craig, Bruce, Ben and the people who catch it",
    script: "A restaurant is only as good as the people who supply it, and Saint Peter has built something truly remarkable — a network of individual fishermen who share Josh Niland's obsession with quality, ethics and care. These aren't faceless distributors. These are people with names, with stories, with philosophies of their own. Take Craig Lukey, based in Ulladulla on the New South Wales South Coast. Craig catches Blue Mackerel — a fish often dismissed as bait, something you catch to catch something better. But Craig goes out on a rod and reel, one fish at a time, and dispatches each one ethically and correctly the moment it comes out of the water. No nets, no trawling, no compromise. It's a practice far more laborious than industrial fishing, but it produces fish of extraordinary quality. This mackerel becomes one of Saint Peter's most beloved dishes, served with olive brine, fish sauce made from mackerel trimmings, and cultured butter, with the famous instruction: Rip, Dip, Butter, Fish. Then there's Luke Buchholz in Arakoon, near South West Rocks, who travels upwards of two hours to reach deep enough water to catch Bonito and Wild Kingfish on a rod and reel. The wild kingfish Luke catches is virtually unrecognisable compared to the farmed variety — fattier, more muscular, with a deep savoury, seaweed-driven flavour. Bruce Collis operates out of Corner Inlet in Victoria, the state's largest bay and inlet fishery, and holds thirteen of the eighteen commercial fishing licences granted there. He uses seine fishing, carefully selecting net sizes to target specific species and sizes, letting smaller fish escape to grow. And in far north Queensland, Ben Collison fishes as a reef guardian, catching coral trout on a hand line and keeping them alive in a tank until the moment of dispatch — packing them belly-down on ice packs and shipping them to Sydney within twenty-four hours of kill. It doesn't get more diligent than that."
  },
  {
    id: 5,
    title: "Sweets of the Sea",
    subtitle: "Fish eye custard, tuna bone fudge and the final course",
    script: "By the time you reach the end of a meal at Saint Peter, you've already had your assumptions about fish rewritten several times over. You've eaten pasta made from bones. You've had mortadella made from flathead. You've had charcuterie hanging in a cabinet for two months. And then the dessert trolley arrives, and the kitchen looks you directly in the eye and says — we're not done yet. Sweets of the Sea is Saint Peter's final act, and it is audacious. It begins with a Whisky Canele — the classic Bordelaise pastry, baked just before service to preserve that glassy caramelised crust and custardy interior, sprayed with whisky, and topped with Kaluga Caviar. Salty, boozy, sweet, rich. A little bow on the edge of savoury and sweet. Then comes the Saint Peter's Choux — a choux pastry filled with Green Yuzu Caramel. So far, so classic. But the custard inside is made using Nannygai eye custard. The vitreous humor — the collagen-rich fluid inside the fish's eye — is extracted and used in place of egg yolk to set the custard. Now, before you recoil — the entire ambition of this dish is that it does not taste of fish at all. Just as using a chicken egg doesn't make ice cream taste like chicken, the eye is simply a source of protein and collagen. The result is a silky, citrusy, elegantly set custard. It's one of the most discussed dishes in Australian food, and rightfully so. And finally — the Yellowfin Tuna Bone Marrow Chocolate Fudge. Valrhona Guanaja seventy percent chocolate from Papua New Guinea, where the cocoa pods are smoke-dried rather than sun-dried, giving the chocolate a deep, smoky richness. Combined with tuna bone marrow in place of butter, topped with raw sugar and bruleed with ironbark charcoal. Saint Peter doesn't just reimagine fish. It reimagines everything."
  }
];

// Cache generated audio blobs
const audioCache = {};
let currentEpId = null;
let currentAudio = null;
let isLoading = false;

function renderEpisodes() {
  document.getElementById('episodeList').innerHTML = EPISODES.map(ep => `
    <div class="episode-card" id="card-${ep.id}" onclick="selectEpisode(${ep.id})">
      <div class="ep-number">0${ep.id}</div>
      <div class="ep-info">
        <h3>${ep.title}</h3>
        <p>${ep.subtitle}</p>
        <div class="ep-status" id="epstatus-${ep.id}"></div>
      </div>
      <button class="ep-play-btn" id="epbtn-${ep.id}">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  `).join('');
}

async function selectEpisode(id) {
  if (isLoading) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }

  currentEpId = id;
  document.querySelectorAll('.episode-card').forEach(c => c.classList.remove('active'));
  document.getElementById('card-' + id).classList.add('active');

  const ep = EPISODES.find(e => e.id === id);
  document.getElementById('playerTitle').textContent = ep.title;
  document.getElementById('playerSubtitle').textContent = ep.subtitle + ' · George · ElevenLabs';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('timeElapsed').textContent = '0:00';
  document.getElementById('timeTotal').textContent = '—';
  document.getElementById('playPauseBtn').disabled = true;
  setPlayIcon(false);

  if (audioCache[id]) {
    playAudio(id, audioCache[id]);
    return;
  }

  // Generate via ElevenLabs
  setStatus('loading', 'Generating with ElevenLabs…');
  showGeneratingBar(true);
  isLoading = true;
  document.getElementById('card-' + id).classList.add('loading');
  document.getElementById('epstatus-' + id).textContent = 'Generating audio…';
  document.getElementById('epbtn-' + id).outerHTML = `<div class="spinner" id="epbtn-${id}"></div>`;

  try {
    const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
      method: 'POST',
      headers: {
        'xi-api-key': API_KEY,
        'Content-Type': 'application/json',
        'Accept': 'audio/mpeg'
      },
      body: JSON.stringify({
        text: ep.script,
        model_id: 'eleven_multilingual_v2',
        voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.3, use_speaker_boost: true }
      })
    });

    if (!response.ok) {
      const err = await response.text();
      throw new Error(err);
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    audioCache[id] = url;

    document.getElementById('card-' + id).classList.remove('loading');
    document.getElementById('epstatus-' + id).textContent = 'Ready';
    const spinner = document.getElementById('epbtn-' + id);
    if (spinner) spinner.outerHTML = `<button class="ep-play-btn" id="epbtn-${id}" onclick="selectEpisode(${id}); event.stopPropagation()"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>`;

    isLoading = false;
    showGeneratingBar(false);
    playAudio(id, url);

  } catch (e) {
    isLoading = false;
    showGeneratingBar(false);
    document.getElementById('card-' + id).classList.remove('loading');
    document.getElementById('epstatus-' + id).textContent = 'Error — tap to retry';
    const spinner = document.getElementById('epbtn-' + id);
    if (spinner) spinner.outerHTML = `<button class="ep-play-btn" id="epbtn-${id}" onclick="selectEpisode(${id}); event.stopPropagation()"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>`;
    setStatus('idle', 'Error generating audio — try again');
    console.error(e);
  }
}

function playAudio(id, url) {
  if (id !== currentEpId) return;
  currentAudio = new Audio(url);
  currentAudio.preload = 'auto';

  currentAudio.addEventListener('timeupdate', updateProgress);
  currentAudio.addEventListener('loadedmetadata', () => {
    document.getElementById('timeTotal').textContent = formatTime(currentAudio.duration);
  });
  currentAudio.addEventListener('ended', () => {
    setStatus('idle', 'Episode complete');
    setPlayIcon(false);
    document.getElementById('progressFill').style.width = '100%';
  });
  currentAudio.addEventListener('error', () => {
    setStatus('idle', 'Playback error');
  });

  document.getElementById('playPauseBtn').disabled = false;
  currentAudio.play();
  setStatus('playing', 'Now playing');
  setPlayIcon(true);
}

function updateProgress() {
  if (!currentAudio || !currentAudio.duration) return;
  const pct = (currentAudio.currentTime / currentAudio.duration) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('timeElapsed').textContent = formatTime(currentAudio.currentTime);
  document.getElementById('timeTotal').textContent = formatTime(currentAudio.duration);
}

function togglePlay() {
  if (!currentAudio) return;
  if (currentAudio.paused) {
    currentAudio.play();
    setStatus('playing', 'Now playing');
    setPlayIcon(true);
  } else {
    currentAudio.pause();
    setStatus('idle', 'Paused');
    setPlayIcon(false);
  }
}

function seekTo(e) {
  if (!currentAudio || !currentAudio.duration) return;
  const bar = document.getElementById('progressBar');
  const rect = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  currentAudio.currentTime = pct * currentAudio.duration;
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  document.getElementById('statusText').textContent = text;
  dot.className = 'status-dot' + (state === 'playing' ? ' playing' : state === 'loading' ? ' loading' : '');
}

function setPlayIcon(playing) {
  document.getElementById('playPauseBtn').innerHTML = playing
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="#1e3a4a"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="#1e3a4a"><path d="M8 5v14l11-7z"/></svg>`;
}

function showGeneratingBar(show) {
  const wrap = document.getElementById('progressBarWrap');
  wrap.innerHTML = show
    ? `<div class="generating-bar"><div class="generating-bar-fill"></div></div>`
    : `<div class="progress-bar" id="progressBar" onclick="seekTo(event)"><div class="progress-fill" id="progressFill"></div></div>`;
}

function formatTime(s) {
  if (!s || isNaN(s)) return '0:00';
  return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0');
}

renderEpisodes();
</script>
</body>
</html>
