    id: 1,
    title: "The Philosophy of Saint Peter",
    subtitle: "Whole fish, zero waste & the vision of Josh Niland",
    script: `Welcome to Saint Peter. And welcome, really, to one of the most genuinely radical ideas in contemporary cooking — the idea that a fish deserves the same reverence, the same skill, and the same completeness of use as any animal that walks on land.

Saint Peter sits on Oxford Street in Paddington, Sydney, and it is the life's work of chef Josh Niland. From the outside it might look like a very handsome seafood restaurant. But spend any time inside, or really pay attention to what arrives at your table, and you start to understand that something far more unusual is happening here. This is a restaurant built around a philosophy. And that philosophy, at its simplest, is this: use the whole fish.

Now, here's what makes that radical. In culinary schools around the world, chefs are taught to use around forty-five to fifty-five percent of a fish. You take the two fillets. You might use the bones for a stock. And that's largely where the story ends. The head, the collar, the liver, the roe, the belly fat, the skin, the eyes — all of that typically goes in the bin. At Saint Peter, they use ninety percent. The only things they consistently set aside are the gills and the gallbladder. Everything else becomes food.

To understand why this matters, you have to think about what a fish actually is. It's a complete animal, with fat distributed through its body in extraordinary ways, with organs that carry deep, complex flavour, with collagen in its bones that can transform the texture of a dish entirely. A fish's belly is as rich and unctuous as pork belly. A fish's liver, handled correctly, makes a pate that could stand alongside anything from a traditional French charcuterie. The roe can be cured and dried into something almost like bottarga. The bones can be pressure cooked until they dissolve into a paste and used to make pasta dough. There is almost nothing, if you think carefully and cook with skill, that cannot be turned into something extraordinary.

To make this vision fully operational, Niland opened Fish Butchery — a sister venue in Waterloo that operates, as the name suggests, exactly like a traditional butcher shop, but one dedicated entirely to fish. It's where the secondary cuts are processed, where the charcuterie is made, where dry-ageing happens, where roe is cured and salami casings are filled. Fish Butchery is the engine room behind everything you eat at Saint Peter.

And why does all of this matter beyond the kitchen? It matters because the fishing industry, globally, is under enormous pressure. Reducing waste at the restaurant end of the chain is one of the most meaningful contributions a chef can make. If every restaurant used ninety percent of the fish it received rather than fifty percent, you'd need to catch dramatically fewer fish to feed the same number of people. Josh Niland didn't just open a great restaurant. He proposed a new way of thinking about one of the world's most important food sources. And he made it delicious.`

    id: 2,
    title: "Opening the Meal — Soups, Consommé & Caviar",
    subtitle: "Bone noodles, sea urchin & the art of the first course",
    script: `Every meal at Saint Peter begins with an act of storytelling. The first courses that arrive at your table are not just delicious — they are an introduction to the ideas that will run through everything that follows. By the time you've finished the opening sequence, you already understand, viscerally, what this restaurant is about.

It begins with the Saint Peter Fish Soup. This is described as an ode to Saint Peter himself, the patron saint of fishermen, and it is built on a traditional bouillabaisse base — roasted shells of Manjimup Marron and Eastern Rock Lobster, along with selections of fish from the menu, typically Snapper from fisherman Anthony Hasslewood, Gurnard from Shoalhaven, and a white fish such as Nannygai. These are cooked down in a mirepoix of tomato, onion, garlic and white wine, then blended together to create a soup with real body and weight — thick and almost velvety on the palate, deeply aromatic, oceanic in the very best sense.

But what makes this soup genuinely extraordinary is what floats inside it. Coral trout bone noodles. The technique behind these noodles is one of the most innovative things happening in Australian cooking right now. The bones of coral trout are first boiled to extract every last bit of flavour and gelatin. They're then pressure cooked for two full hours, until they become almost impossibly soft. The team then purees those bones with one part water to two parts bones, passes the resulting paste through a fine sieve to ensure perfect consistency, and then mixes that paste with equal parts flour to create a pasta dough. The bones of the fish become the pasta itself. It is a technique of such elegant, almost poetic circularity that it stops you in your tracks.

And the vessel the soup arrives in? Also made from fish. The cups are crafted by Sam Gordon, a potter based in Gembrook in Victoria, and they are made with clay that contains around forty percent Murray Cod bones. The glaze is made from one hundred percent Murray Cod bones. Even the cup in your hands is an act of whole-fish philosophy.

The consomme course develops these ideas further. A consomme is a classical French technique — a stock clarified with protein, usually egg white, until it becomes perfectly, jewel-like clear. At Saint Peter, it begins with the frames and bones of coral trout, roasted until they become almost golden and caramelised, then cooked down into a rich aromatic stock. Oysters and scallops are added to bring a sweet, briny fragrance. The whole thing is then clarified with egg white until it shimmers. Inside the consomme float agnolotti — small stuffed pasta parcels — whose dough is also made from pressure-cooked coral trout bones used as an egg replacement. They're filled with rockflathead mousse. Pick up the cup, sip the consomme, use the fork for the pasta. It is one of the most technically astonishing single bites of food you are likely to encounter anywhere in the world.

Then there is the sea urchin on blini. This urchin comes from Port Phillip Bay, near the Mornington Peninsula in Victoria, and it is graded twelve-A — the highest possible grade, where twelve refers to the size of the tongues and A denotes the quality class. Urchin of this calibre is typically exported directly to Japan, where demand and prices are far higher. Josh Niland describes eating it as dipping French butter directly into the ocean. It sits on a fermented rice cake that is pan-fried until crisp. It is, in two bites, everything.

And for those lucky enough to be offered the tuna tartare blini — the tuna comes from either Heidi and Pavo Walker in Mooloolaba on Queensland's Sunshine Coast, or from Craig Lukey in Ulladulla. It's made from the trimmings and secondary cuts of the fish, diced finely and dressed with fermented white asparagus juice, hand-picked capers from Ananda Capers in the Limestone Coast of South Australia, and chives. Sometimes it's topped with aged Kaluga Caviar, reserve grade, aged twelve months. These opening bites set the tone for everything that follows — precision, creativity, and an absolute refusal to waste a single thing.`
  },
  {
    id: 3,
    title: "The Charcuterie Board",
    subtitle: "Salamis, hams, nduja, pate and the art of fish curing",
    script: `There is a moment, early in a meal at Saint Peter, when a board arrives at the table. And it looks, at first completely convincing glance, like a serious European charcuterie spread. There are slices of something that resembles cured ham, glistening and translucent. There are salamis, cross-sections showing a beautiful distribution of fat and protein. There are small tart shells piped with silky pate. There are gordal olives, fat and green. And there is something that looks unmistakably like nduja, the fiery spreadable sausage of Calabria.

Not a single gram of pork, beef, or lamb is present on this board. Every last thing is made from fish.

The charcuterie program at Saint Peter, developed in partnership with Fish Butchery in Waterloo, is perhaps the single most audacious expression of the whole-fish philosophy. It is where all the secondary cuts, the trimmings, the heads, collars, tails, and offcuts, are transformed using the full toolkit of traditional European curing and fermentation. Whatever a butcher can do to an animal, they can do to a fish.

Let's begin with the Striped Marlin Ham. This is exactly what it sounds like. A whole piece of striped marlin is cured for a full week in salt and sugar. It's then removed from the cure and cold smoked over apple wood chips. It then goes into the charcuterie cabinet, where it hangs for a minimum of six weeks, with the ambition of serving it at eight weeks. The result has the translucent, jewel-like quality of a great prosciutto, with a flavour that is deeply savoury, faintly smoky, and unmistakably oceanic. Eight weeks of patience, in a single thin slice.

The Swordfish Belly Bacon follows a similar path. The belly is cured for a week in a ground seasoning of salt, sugar, cumin, coriander, pepper, fennel and star anise — a spice profile that nods towards the Middle East while remaining entirely its own thing. Cold smoked over apple wood, then hung for six to eight weeks. The fat of the swordfish belly renders beautifully in the curing process, creating something with real richness and depth.

Then come the salamis. The Yellowfin Tuna Salami is made from the sinew-rich trimmings of the tuna — the cuts from the head, tail, and collar, the parts that most kitchens would discard without a second thought. This trim is ground and mixed with salt-cured Murray Cod fat, which is also coarsely ground. It's seasoned with garlic and onion powder and salt, then filled into beef casings. These salamis need to lose thirty percent of their original moisture content before they reach the right texture — a process that takes anywhere from four to six weeks depending on the batch. They come in several styles: pistachio, chilli, and a fattier saucisson-style, depending on what the chef decides on the day.

The Yellowfin Tuna Nduja is made from the same trim — head, tail, collar — ground and then mixed with rendered Murray Cod fat and seasoned with a complex spice blend of paprika, nutmeg, chilli, coriander seed, cumin seed, pepper, sumac, garlic and salt. This nduja is then piped inside the fat gordal green olives on the board. The spice and fat of the nduja and the brine of the olive are a combination of almost reckless deliciousness.

There is also Loukaniko — a traditional Greek hunter's sausage, usually made from pork or lamb, seasoned with orange peel, fennel seed and rosemary. Here it's made from yellowfin tuna trim and Murray Cod fat, stuffed into a pork casing, hot smoked, and then hung for two days to dry the skin. And Sujuk, a strongly spiced sausage from the Middle East and Balkans, usually made from lamb or beef — here made with tuna trimming ground almost to a puree, seasoned with garlic, cumin, roast pepper and allspice, steamed in a synthetic casing and then carved thinly.

The Rock Flathead Mortadella deserves special mention. Mortadella is one of Italy's great contributions to the world — a silky, finely ground pork salume studded with cubed fat. The Saint Peter version uses rock flathead trimmings, some of which are smoked beforehand, pureed with egg white to create an almost mousse-like texture, mixed with cured Murray Cod fat and swordfish belly bacon, filled into a synthetic casing and steamed. It is extraordinarily delicate and creamy.

And then the tarts. The John Dory Liver Pate tart begins with a reduction of port, shallots, bay and thyme, which is added to fresh John Dory livers, quickly sauteed, then blended with slowly added butter to create a rich, silky pate, chilled and piped into pre-baked tart shells, topped with port jelly. The Coral Trout Head Coronation Tart uses steamed and picked coral trout head meat, folded with ghee, fenugreek, onion, garlic, cumin, coriander seeds, chopped parsley, and either pickled desert lime or grape, pressed into tart shells and topped with a verjus jelly set with fresh marigold petals. And the Smoked Bar Cod Taramasalata Tart — smoked bar cod roe, whipped with oil, garlic, soy and rice vinegar, folded through sour cream, set into a tart shell with fish gelatin, and topped with a celeriac and seaweed jelly.

This is charcuterie as art, as philosophy, as proof. Every plate is a demonstration that the language of preservation, curing, smoking and fermentation belongs to the sea just as much as it belongs to the land.`
  },
  {
    id: 4,
    title: "The Fishermen & The Fish",
    subtitle: "Raw courses, coal-kissed fish & the people who catch them",
    script: `A restaurant like Saint Peter could not exist without extraordinary relationships with extraordinary people. And nowhere is this more apparent than in the middle courses of the menu — the raw dishes, the lightly cooked fish, the moments where the quality of a single ingredient has nowhere to hide. These dishes are a direct expression of the fishermen who supply them.

Let's start with Craig Lukey, based in Ulladulla on the New South Wales South Coast. Craig is the man behind what has become one of Saint Peter's most beloved and talked-about dishes — the Salt and Vinegar Blue Mackerel. Blue mackerel has historically been treated as a bait fish, something you catch to catch something better and bigger. Craig Lukey has spent years arguing that this is entirely wrong, and his method proves it. He goes out on a rod and reel, catching mackerel one at a time, and goes to extraordinary lengths to dispatch each fish ethically and correctly the moment it comes aboard. This is far more laborious and time-consuming than trawling mackerel in a net. It is also the difference between a mediocre fish and an exceptional one. Correct dispatch and careful handling mean the flesh arrives at the restaurant in immaculate condition.

At Saint Peter, the mackerel is filleted and then salted for sixty minutes. It's then submerged in champagne vinegar for a further fifteen minutes, leaving it very lightly pickled — barely cured, really, just kissed with acid. It's served with a dressing of gordal olive brine and a fish sauce made from mackerel trimmings, alongside excellent picual extra virgin olive oil. On the side comes warm sourdough from Fiore Bakery in McMahons Point — a family-run bakery where Sam and Alberto, who trained at Iggy's in Bronte, make bread on a thirty-six hour ferment using heritage flour from Wholegrain Milling in Gunnedah, New South Wales. And cultured butter from Long Paddock, a small-scale artisan cheesery at the Mill in Castlemaine in central Victoria. The instruction from the kitchen is explicit and non-negotiable: Rip the bread. Dip it in the olive brine until it's wet. Butter it liberally. Top it with a slice of mackerel. Rip, dip, butter, fish.

Depending on the season, this course might instead feature King George Whiting — sourced either from Bruce Collis in Corner Inlet, or from Jeff Schmucker in Denial Bay in South Australia. Jeff is a very small operator, contactable only by call or text, who goes out alone to line-catch and brain-spike every single fish. King George Whiting gets salted for one hundred and twenty minutes and pickled for forty-five. Or it might be Garfish from Bruce Collis, salted for one hundred and twenty minutes and pickled for thirty.

Then there is Luke Buchholz, based in Arakoon near South West Rocks — roughly halfway between Sydney and the Gold Coast. Luke catches on a rod and reel, and he has to travel upwards of two hours offshore to reach water deep enough for Bonito and Wild Kingfish. Bonito is part of the scombridae family, alongside tuna and mackerel — a dark, rich, oily fish with real intensity. Wild Kingfish is something else entirely compared to the farmed variety that dominates Australian restaurants — fattier, more muscular, with a deep savoury, seaweed-inflected flavour that only comes from an animal that has been fighting currents and hunting in open water.

Both fish are coal-kissed before serving — a technique where a piece of hot charcoal is run directly over the flesh or skin of the fish, imparting a breath of smoke while leaving the fish entirely raw. It's a technique of beautiful restraint. The fish arrives cool to the touch, raw in texture, with just the ghost of smoke on its surface.

The coal-kissed fish is served over a pesto made from wild mustard leaves, fresh Victorian pistachios, hand-picked capers from Ananda Capers in South Australia — where Liz and John spend around four hours to harvest a single kilogram, curing everything in Olsson's sea salt — along with sudachi juice and extra virgin olive oil. Finished with black garlic vinegar and verjus. In season, Japonica Prawns from Matt Calder up in the Whitsundays are added — a sweet, firm prawn designed to be eaten raw, also coal-kissed.

Then there is the Southern Calamari, sourced from Bruce Collis in Corner Inlet in Victoria. The Corner Inlet is Victoria's largest bay and inlet fishery, producing around four hundred and forty-six tonnes of fresh seafood annually, with strict licensing — only eighteen commercial licences exist in the entire inlet, and Bruce holds thirteen of them. He fishes using a method called seine fishing, a net-based approach where the hole size is carefully selected to target a specific species at a specific size, allowing smaller fish to escape. The waters of the Corner Inlet are fed by ocean tides from the Bass Strait, bringing nutrient-rich water into an environment thick with seagrass. That seagrass is what the calamari feed on, and it gives them a distinctive sweetness that is specific to this single location on earth.

At Saint Peter, the calamari is prepared with obsessive care. The tentacles are removed and used separately as a bar snack. The membrane from both sides of the body is removed — a laborious process, but one that eliminates any chewiness entirely. The whole piece is then grilled over ironbark charcoal for around one minute, flipped constantly to avoid score marks. Once cooked it is sliced paper-thin by hand to resemble glass noodles. Underneath sits the yellowfin tuna nduja — the same preparation found inside the gordal olive on the charcuterie board — cooked until its natural fats render and the tuna caramelises. The instruction: taste the calamari first, on its own, to appreciate its sweetness. Then fold the nduja through.

And then there is the dry-aged Yellowfin Tuna from Heidi and Pavo Walker in Mooloolaba, Queensland. They go out on charters, long-line fishing up and down the Sunshine Coast — a big mechanical line with up to eight hooks that catches the fish and brings them back. The tuna are received whole at Fish Butchery, where the belly and head are removed and the trunk is dry-aged, hung from the tail, at zero degrees Celsius in a completely static, non-fan-forced environment. Fan-forced air would cause too much moisture loss before the flesh develops flavour. Dry-ageing is the intentional, controlled loss of moisture over time — around two percent per day — during which glutamates develop within the flesh, making it more savoury, more complex, more meaty. The texture firms. The flavour deepens. Different cuts appear each night — sirloin, cap, chain, belly, loin — typically glazed in soy and muscovado sugar, sometimes spiced with coriander, juniper and black pepper, then cooked low and slow before being finished over charcoal to caramelise the glaze and toast the spices.`
  },
  {
    id: 5,
    title: "Main Courses, Desserts & Sweets of the Sea",
    subtitle: "Coral trout, fried flathead, native fruits & fish eye custard",
    script: `By the time the main courses arrive at Saint Peter, you are already several acts deep into one of the most considered menus in the country. And yet somehow, the kitchen keeps finding new ways to astonish you.

The Hand Line Caught Coral Trout is the centrepiece of the menu, and it comes from one of two remarkable fishermen. The first is Ben Collison in Bowen, in far north Queensland. Ben is a reef guardian fisherman with extraordinarily strict personal ethics around the fish he catches. Once a coral trout is brought up on a hand line, it is held alive in a tank on his boat until Ben has enough to fill an order. When he commits to a shipment, he dispatches each fish individually, packs them belly-side down in boxes lined with ice packs, and ships them to Sydney. They arrive within twenty-four hours of being killed. The second source is Chris Bolton, based in Kurrimine Beach but fishing mainly around Noggin Reef, just south of Cairns. Chris works from small boats, which limits the number of fish caught at any one time and means he never stays out on the water for more than twenty-four hours. He kills each fish instantly using Ike-Jime — a Japanese brain-spiking technique considered the most humane and quality-preserving method of dispatch available. The exact GPS coordinates of where Chris catches his fish are printed on the menu alongside a video of him at work.

The fillet of coral trout — by this point in the meal, you will already have eaten its bones as noodles, its head in a terrine, its frames as consomme — is wrapped in thin slices of Tasmanian White Asparagus, grown by Richard and Belinda Weston about three kilometres from Hobart. The asparagus is grown from a European strain, started in fertile soil and then moved to trenches where it grows covered, never seeing sunlight, which is why it never produces chlorophyll and stays white. The wrapped fillet is steamed, then topped with a potato dauphine — a mixture of choux pastry and mashed potato that is fried until golden — a potato crisp, and flowering shiso. Underneath is a kale vadouvan sauce, a French-Indian fusion preparation heavy with butter, fenugreek, cumin and coriander seed, split with a macadamia tahini and finished with two jams: kumquat, a bracingly citrusy preserve, and bull kelp, a type of seaweed harvested from the Royal National Park in New South Wales by Craig Shepard, one of only two people in the country licensed to do so.

Then there is the Batter Fried Rock Flathead, again from Bruce Collis in Corner Inlet — a fish often described as the Rolls-Royce of the flathead varieties, naturally sweet from its diet of crustaceans and the seagrass of the inlet. A fillet is wrapped inside a female zucchini flower — the females being identifiable by the small green zucchini attached to the flower — and the whole thing is battered and fried until the pastry is shatteringly crisp and the fish inside is just set. Underneath sits braised yellow zucchini cooked in anchovy, lemon and garlic, along with small discs of the green zucchini for contrasting texture, pickled desert limes, kumquat jam, bull kelp jam, the same kale vadouvan sauce, and macadamia tahini. It is, simultaneously, deeply comforting and completely original.

Before the desserts proper, there is a course of native Australian fruits, sourced from Andrew Fielke of Creative Native, positioned near the Coorong in South Australia. A percentage of the revenue from these hand-harvested fruits goes back to the local indigenous communities who do this work. Each fruit is presented as a sorbet. Lemon Aspen, also known as white aspen — native to tropical eastern Australia, with an earthy lemon flavour. Desert Lime, also known as bush lime — native to the desert regions, zesty and sharp, containing around three times the vitamin C of a navel orange. Native Black Mint — refreshing, herbaceous, actually part of the marigold family rather than true mint. Quandong, or wild desert peach — zesty, orange-like, from the arid regions. Emu Apple, also known as Muntries — a cranberry-apple flavour from the coastal regions of South Australia, with three times the antioxidants of a blueberry. And Ooray Plum, or Davidson Plum — native to tropical rainforest in eastern Australia, intensely, almost aggressively sour. The sorbets are presented inside a bowl of fresh lemon leaves, with a blend of lemon myrtle and sandalwood essential oils releasing beneath the bowl as it arrives.

Then come the tarts. The Custard Tart is one of the originals — one of the first desserts ever on the Saint Peter menu on Oxford Street. A filling of eggs, milk, cream, sugar and vanilla from the Cassowary Coast in tropical north Queensland — Phil Doyle's operation, producing only around one hundred kilograms of vanilla per year — baked in a butter pastry shell, freshly grated nutmeg on top. These tarts are baked just before service and never refrigerated. They arrive warm. On the side is what the menu calls Very Good Cream — from St. David's Dairy in Fitzroy, Melbourne's only micro-dairy, keeping their cattle in Gippsland but processing everything in the city, with a minimum fat content of twenty-eight percent. It is the colour of butter and pours like a dream. There is also a citrus tart, currently a Green Yuzu version, topped with classic Italian meringue finished with a hot piece of compressed Australian ironbark charcoal from the Blue Mountains.

And finally — Sweets of the Sea. Because at Saint Peter, even dessert is an argument.

First, the Whisky Canele. A canele is a small French pastry from Bordeaux, born from the tradition of using egg yolks left over after winemakers used the whites to clarify wine. It has a soft, custard-like interior and a thick, dark, glassy caramelised crust, shaped like a small ridged cylinder. At Saint Peter, these are baked just before service to preserve that contrast between exterior and interior, then sprayed with whisky and topped with Kaluga Caviar. It is an extraordinary three-ingredient combination.

Then the Saint Peter's Choux. A choux pastry shell filled with Green Yuzu Caramel and Nannygai Eye Custard. The custard is made by extracting the vitreous humor — the collagen-rich fluid inside the eye of the Nannygai fish — and using it as an egg yolk replacement. Just as using a chicken egg doesn't make ice cream taste like chicken, the eye's function here is purely structural — providing protein and collagen to set the custard. The ambition is absolute: a dessert that is delicious and does not taste remotely of fish. By every account, it succeeds.

And the finale — Yellowfin Tuna Bone Marrow Chocolate Fudge. Made with Valrhona Guanaja seventy percent dark chocolate from Papua New Guinea, where the cocoa pods cannot be sun-dried due to the country's extreme rainfall and are instead smoked, giving the chocolate a uniquely deep, smoky complexity. Tuna bone marrow is used in place of butter. The fudge is topped with raw sugar and bruleed with ironbark charcoal. It is served alongside Fish Jellies — set with fish gelatin and flavoured with Rosella, a hibiscus family flower, seasonal and subject to change.

Saint Peter is not a restaurant that asks you to be adventurous for adventure's sake. It asks you to pay attention. To consider where your food comes from, how it was caught, how long it took to prepare, and how many animals did not have to die to put it on your table. It is a place that takes the most fleeting, perishable, overlooked of all protein sources and treats it with the care and craft of the finest kitchen in the world. That, in the end, is what makes it extraordinary.`
  }
];

const audioCache = {};
let currentEpId = null;
let currentAudio = null;
let isLoading = false;

function renderEpisodes() {
  document.getElementById('episodeList').innerHTML = EPISODES.map(ep => `
    <div class="episode-card" id="card-${ep.id}" onclick="selectEpisode(${ep.id})">
      <div class="ep-number">0${ep.id}</div>
      <div class="ep-info">
        <h3>${ep.title}</h3>
        <p>${ep.subtitle}</p>
        <div class="ep-status" id="epstatus-${ep.id}"></div>
      </div>
      <button class="ep-play-btn" id="epbtn-${ep.id}">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  `).join('');
}

async function selectEpisode(id) {
  if (isLoading) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  currentEpId = id;
  document.querySelectorAll('.episode-card').forEach(c => c.classList.remove('active'));
  document.getElementById('card-' + id).classList.add('active');
  const ep = EPISODES.find(e => e.id === id);
  document.getElementById('playerTitle').textContent = ep.title;
  document.getElementById('playerSubtitle').textContent = ep.subtitle + ' · George · ElevenLabs';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('timeElapsed').textContent = '0:00';
  document.getElementById('timeTotal').textContent = '—';
  document.getElementById('playPauseBtn').disabled = true;
  setPlayIcon(false);
  if (audioCache[id]) { playAudio(id, audioCache[id]); return; }
  setStatus('loading', 'Generating with ElevenLabs…');
  showGeneratingBar(true);
  isLoading = true;
  document.getElementById('card-' + id).classList.add('loading');
  document.getElementById('epstatus-' + id).textContent = 'Generating audio…';
  const btn = document.getElementById('epbtn-' + id);
  if (btn) btn.outerHTML = `<div class="spinner" id="epbtn-${id}"></div>`;
  try {
    const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
      method: 'POST',
      headers: { 'xi-api-key': API_KEY, 'Content-Type': 'application/json', 'Accept': 'audio/mpeg' },
      body: JSON.stringify({
        text: ep.script,
        model_id: 'eleven_multilingual_v2',
        voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.3, use_speaker_boost: true }
      })
    });
    if (!response.ok) throw new Error(await response.text());
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    audioCache[id] = url;
    document.getElementById('card-' + id).classList.remove('loading');
    document.getElementById('epstatus-' + id).textContent = 'Ready';
    const spinner = document.getElementById('epbtn-' + id);
    if (spinner) spinner.outerHTML = `<button class="ep-play-btn" id="epbtn-${id}" onclick="selectEpisode(${id});event.stopPropagation()"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>`;
    isLoading = false;
    showGeneratingBar(false);
    playAudio(id, url);
  } catch(e) {
    isLoading = false;
    showGeneratingBar(false);
    document.getElementById('card-' + id).classList.remove('loading');
    document.getElementById('epstatus-' + id).textContent = 'Error — tap to retry';
    const spinner = document.getElementById('epbtn-' + id);
    if (spinner) spinner.outerHTML = `<button class="ep-play-btn" id="epbtn-${id}" onclick="selectEpisode(${id});event.stopPropagation()"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>`;
    setStatus('idle', 'Error — try again');
  }
}

function playAudio(id, url) {
  if (id !== currentEpId) return;
  currentAudio = new Audio(url);
  currentAudio.addEventListener('timeupdate', updateProgress);
  currentAudio.addEventListener('loadedmetadata', () => { document.getElementById('timeTotal').textContent = formatTime(currentAudio.duration); });
  currentAudio.addEventListener('ended', () => { setStatus('idle','Episode complete'); setPlayIcon(false); document.getElementById('progressFill').style.width='100%'; });
  document.getElementById('playPauseBtn').disabled = false;
  currentAudio.play();
  setStatus('playing','Now playing');
  setPlayIcon(true);
}

function updateProgress() {
  if (!currentAudio||!currentAudio.duration) return;
  const pct=(currentAudio.currentTime/currentAudio.duration)*100;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('timeElapsed').textContent=formatTime(currentAudio.currentTime);
  document.getElementById('timeTotal').textContent=formatTime(currentAudio.duration);
}

function togglePlay() {
  if (!currentAudio) return;
  if (currentAudio.paused) { currentAudio.play(); setStatus('playing','Now playing'); setPlayIcon(true); }
  else { currentAudio.pause(); setStatus('idle','Paused'); setPlayIcon(false); }
}

function seekTo(e) {
  if (!currentAudio||!currentAudio.duration) return;
  const bar=document.getElementById('progressBar');
  const rect=bar.getBoundingClientRect();
  currentAudio.currentTime=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width))*currentAudio.duration;
}

function setStatus(state,text) {
  const dot=document.getElementById('statusDot');
  document.getElementById('statusText').textContent=text;
  dot.className='status-dot'+(state==='playing'?' playing':state==='loading'?' loading':'');
}

function setPlayIcon(playing) {
  document.getElementById('playPauseBtn').innerHTML=playing
    ?`<svg width="18" height="18" viewBox="0 0 24 24" fill="#1e3a4a"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`
    :`<svg width="18" height="18" viewBox="0 0 24 24" fill="#1e3a4a"><path d="M8 5v14l11-7z"/></svg>`;
}

function showGeneratingBar(show) {
  document.getElementById('progressBarWrap').innerHTML=show
    ?`<div class="generating-bar"><div class="generating-bar-fill"></div></div>`
    :`<div class="progress-bar" id="progressBar" onclick="seekTo(event)"><div class="progress-fill" id="progressFill"></div></div>`;
}

function formatTime(s) {
  if(!s||isNaN(s)) return '0:00';
  return Math.floor(s/60)+':'+Math.floor(s%60).toString().padStart(2,'0');
}

renderEpisodes();
</script>
</body>
</html>
